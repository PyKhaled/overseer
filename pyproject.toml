[dependency-groups]
runtime = [
    "Flask==3.1.3",
    "docker==7.2.0",
    "gunicorn==26.2.0",
]
docs = [
    "mkdocs-material==9.7.7",
]
dev = [
    { include-group = "runtime" },
    { include-group = "docs" },
    "coverage[toml]==7.16.2",
    "pip-audit==2.10.1",
    "ruff==0.16.10",
]

[tool.coverage.run]
branch = true
source = ["overseer"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
