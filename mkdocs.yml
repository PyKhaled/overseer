site_name: Overseer
site_description: Project-centric observability and control for Docker Compose applications
site_url: https://pykhaled.github.io/Overseer/
repo_url: https://github.com/PyKhaled/Overseer
repo_name: PyKhaled/Overseer
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: en
  logo: assets/images/overseer-sentinel-icon.svg
  favicon: assets/images/overseer-sentinel-icon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Development: development.md
  - Deployment and Security: deployment.md
  - HTTP API: api.md
  - Project Operations: operations.md
  - Releasing: releasing.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

copyright: Copyright &copy; 2026 PyKhaled
