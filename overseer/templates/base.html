<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Overseer Dashboard{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/overseer-sentinel-icon.svg') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon-32.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">

  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      --background: #0f172a;
      --panel: #111827;
      --panel-muted: #1f2937;
      --border: #475569;
      --text: #e5e7eb;
      --text-muted: #9ca3af;
      --text-subtle: #94a3b8;
      --focus: #60a5fa;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--panel-muted);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding: 14px 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    .brand-logo { display: block; width: auto; height: 36px; }

    nav { display: flex; gap: 6px; }

    nav a {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 8px 12px;
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 14px;
      text-decoration: none;
    }

    nav a:hover,
    nav a:focus-visible {
      background: var(--panel-muted);
      color: var(--text);
    }

    nav a.active { background: #2563eb; color: #fff; }

    main {
      flex: 1;
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    h1,
    h2,
    p { margin-top: 0; }

    h1,
    h2 { font-weight: 650; line-height: 1.25; }

    h1 { margin-bottom: 6px; font-size: 24px; }
    h2 { font-size: 18px; }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    summary:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    button,
    input,
    select { font: inherit; }

    .message {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding: 12px 14px;
      border: 1px solid;
      border-radius: 8px;
      font-size: 14px;
    }

    .message.error {
      border-color: #b91c1c;
      background: #450a0a;
      color: #fecaca;
    }

    .message.success {
      border-color: #15803d;
      background: #052e16;
      color: #bbf7d0;
    }

    .message button {
      min-height: 36px;
      padding: 6px 12px;
      border: 1px solid currentColor;
      border-radius: 6px;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }

    footer {
      margin-top: 20px;
      padding: 14px;
      border-top: 1px solid var(--panel-muted);
      color: var(--text-subtle);
      font-size: 13px;
      text-align: center;
    }

    footer a { color: #60a5fa; text-decoration: none; }

    @media (max-width: 640px) {
      .header-inner {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
        padding: 14px 12px;
      }

      nav {
        width: 100%;
        overflow-x: auto;
        padding-bottom: 2px;
      }

      nav a {
        flex: 0 0 auto;
        min-height: 44px;
        text-align: center;
      }

      .brand-logo { height: 34px; }
      main { padding: 18px 12px; }
      .message { align-items: stretch; flex-direction: column; }
    }

    {% block styles %}{% endblock %}
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="{{ url_for('index') }}">
        <img
          class="brand-logo"
          src="{{ url_for('static', filename='images/overseer-sentinel-logo-dark.svg') }}"
          width="144"
          height="40"
          alt="Overseer"
        >
      </a>
      <nav aria-label="Dashboard navigation">
        <a
          href="{{ url_for('index') }}"
          {% if request.endpoint == 'index' %}class="active" aria-current="page"{% endif %}
        >Overview</a>
        <a
          href="{{ url_for('dependencies') }}"
          {% if request.endpoint == 'dependencies' %}class="active" aria-current="page"{% endif %}
        >Dependencies</a>
        <a
          href="{{ url_for('service_controls') }}"
          {% if request.endpoint == 'service_controls' %}class="active" aria-current="page"{% endif %}
        >Containers</a>
        <a href="{{ url_for('operations') }}"
           {% if request.endpoint == 'operations' %}class="active" aria-current="page"{% endif %}
        >Operations</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="message" id="message" aria-atomic="true"></div>
    {% block content %}{% endblock %}
  </main>

  <footer>
    Overseer {{ overseer_version }} • © 2026 PyKhaled. All rights reserved.
    <br>
    Built for internal infrastructure management •
    <a href="mailto:ahmedaka@icloud.com">Contact</a>
  </footer>

  <script>
    let retryAction = null;

    function showMessage(message, type = "error", retry = null) {
      const element = document.getElementById("message");
      const text = document.createElement("span");
      text.textContent = message;
      element.replaceChildren(text);
      element.className = `message ${type}`;
      element.setAttribute("role", type === "error" ? "alert" : "status");
      element.style.display = "flex";
      retryAction = retry;

      if (retry) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "Retry";
        button.addEventListener("click", () => retryAction?.());
        element.appendChild(button);
      }
    }

    function showError(message, retry = null) {
      showMessage(message, "error", retry);
    }

    function showSuccess(message) {
      showMessage(message, "success");
    }

    function clearMessage() {
      const element = document.getElementById("message");
      element.replaceChildren();
      element.className = "message";
      element.removeAttribute("role");
      element.style.display = "none";
      retryAction = null;
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, options);
      let payload = null;
      try {
        payload = await response.json();
      } catch (error) {
        if (response.ok) {
          throw new Error("The server returned an invalid response");
        }
      }

      if (!response.ok) {
        throw new Error(payload?.error || `Request failed (${response.status})`);
      }

      return payload;
    }

    function serviceAnchor(serviceName) {
      const normalized = String(serviceName || "service")
        .toLowerCase()
        .replace(/[^a-z0-9_-]+/g, "-")
        .replace(/^-+|-+$/g, "");
      return `service-${normalized || "unknown"}`;
    }

    window.Overseer = {
      clearError: clearMessage,
      clearMessage,
      requestJson,
      serviceAnchor,
      showError,
      showSuccess
    };
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
