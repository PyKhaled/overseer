name: Documentation

on:
  push:
    branches:
      - gh-pages
    paths:
      - "**/*.html"
      - assets/**
      - docs/**
      - download/**
      - news/**
      - sponsors/**
      - .nojekyll
      - robots.txt
      - sitemap.xml
      - .github/scripts/validate-site.mjs
      - .github/workflows/docs.yml
  pull_request:
    branches:
      - gh-pages
    paths:
      - "**/*.html"
      - assets/**
      - docs/**
      - download/**
      - news/**
      - sponsors/**
      - .nojekyll
      - robots.txt
      - sitemap.xml
      - .github/scripts/validate-site.mjs
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate static website
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'gh-pages' || github.sha }}

      - name: Validate site structure and references
        run: node .github/scripts/validate-site.mjs

      - name: Check JavaScript syntax
        run: find assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  publish:
    name: Publish static website
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/gh-pages' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}

    steps:
      - name: Check out website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'gh-pages' || github.sha }}

      - name: Assemble static website
        run: |
          mkdir _site
          cp -R 404.html assets docs download index.html news robots.txt sitemap.xml sponsors _site/
          cp .nojekyll _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload static website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

      - name: Publish to GitHub Pages
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
