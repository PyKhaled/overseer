name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install --group dev
          python -m pip uninstall --yes setuptools

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests with coverage
        run: coverage run -m unittest discover -s tests -v

      - name: Test browser action state
        run: node --test tests/*.cjs

      - name: Enforce coverage threshold
        run: coverage report

      - name: Audit Python dependencies
        run: python -m pip_audit --cache-dir /tmp/pip-audit-cache

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install --group runtime

      - name: Run tests
        run: python -m unittest discover -s tests -v

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  container:
    name: Container build and smoke test
    needs:
      - quality
      - test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: overseer:ci
          cache-from: type=gha,scope=overseer-ci
          cache-to: type=gha,mode=max,scope=overseer-ci

      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: overseer:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

      - name: Start container
        run: |
          docker run --detach \
            --name overseer-smoke \
            --publish 127.0.0.1:8765:8765 \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            overseer:ci

      - name: Smoke test container
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/healthz; then
              curl --fail --silent http://127.0.0.1:8765/
              curl --fail --silent http://127.0.0.1:8765/api/services
              exit 0
            fi
            sleep 1
          done
          docker logs overseer-smoke
          exit 1

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force overseer-smoke || true
